<main>
<form action="#" method="post">
    <!-- action= direciona para onde os dados vao depois -->
     <!-- method = método como vai abrir. post ou get -->

<img src="../assets/fotos/criarconta.png" alt="Criar conta">

<div class="labels">

<!-- /*nome*/ -->
 <div class="grupo">
    <label for="nome">Apelido</label>
    <div class="campo">
    <img class="icone" src="../assets/fotos/conta.png" alt="">
    <input type="text" name="nome" id="nome"placeholder="Digite seu Apelido" required >
    <!-- placeholder é para colocar textinhos dentro do campo -->
    </div>
 </div>


  <!-- label: texto (ex: nome) input: adicionar a caixa de texto -->

  <!-- email -->
  <div class="grupo">
      <label for="email">Email</label><br>
    <div class="campo">
    <img class="icone" src="../assets/fotos/email.png" alt="">
    <input type="email" name="email" id="email"  placeholder="Ex.: anasousa@gmail.com"required>
    </div>
  </div>

  <!-- senha -->
  <div class="grupo">
    <label for="senha">Senha</label> <br>
    <div class="campo">
    <img class="icone" src="../assets/fotos/senha.png" alt="">
    <input type="password" name="senha" id="senha" placeholder="Ex.:12345678" required >
    </div>
  </div>

 <!-- senha -->
<div class="grupo">
  <label for="confirmar-senha">Confirme sua Senha</label> <br>
  <div class="campo">
    <img class="icone" src="../assets/fotos/senha.png" alt="">
    <input type="password" name="confirmar-senha" id="confirmar-senha"
    placeholder="Confirme sua senha" required >
  </div>
<!-- password: dados sensíveis -->
</div>
  

<!-- aceito termos -->
 <div id="termos"> 
  <input type="checkbox" name="aceito" id="aceito" value="aceito" required>
  <label for="aceito">Li e Aceito os <span><a href="termos de uso">Termos de Uso</a></span>
</label>
 </div>

<!-- botão criar -->
<button>Criar conta ♡</button>

<p>Já possuo conta <span> <a href="../html/login.html">Login</a></span></p >

</div>
