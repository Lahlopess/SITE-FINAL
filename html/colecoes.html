<!DOCTYPE html>
<!-- O atributo lang vai mudar dinamicamente via JavaScript entre "pt-BR" e "en" -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lolah Amigurumi</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../javaScript/script.js" defer></script>
</head>

<body>

    <!-- ACESSIBILIDADE: Trocado de div para header para indicar o topo da página -->
   
    <header id="topo">

        <!-- LOGO -->
        <a href="../index.html" id="logo">

            <img src="../assets/fotos/logo.png" alt="Lolah Amigurumi">

        </a>


        <!-- BARRA DE PESQUISA -->
     
        <div class="barra-pesquisa">
            <!-- ACESSIBILIDADE: Rótulo oculto (aria-label) para o leitor de tela saber o que é o campo -->
            <input type="text" id="pesquisa" placeholder="O que você está procurando?" aria-label="Buscar produtos">
            <button type="button" id="btn-pesquisa" aria-label="Pesquisar">🔍</button>
        </div>

        <!-- NAVEGAÇÃO -->
        <nav class="navegacao">

            <!-- BOTÃO DE TEMA -->
            <button
                type="button"
                id="btn-tema"
                data-pt="🌑 Modo Escuro"
                data-en="🌑 Dark Mode">

                🌑 Modo Escuro

            </button>


            <!-- IDIOMA -->
            <div class="seletor-idioma">

                <label for="idioma-select" class="sr-only">
                    Idioma
                </label>

                <select id="idioma-select">

                    <option value="pt">PT-BR</option>

                    <option value="en">EN</option>

                </select>

            </div>


          
            <!-- CARRINHO -->
            <a
                href="../html/carrinho.html"
                data-pt="🛒 Carrinho"
                data-en="🛒 Cart">

                🛒 Carrinho

            </a>
            
            <!-- MINHA CONTA -->
            <a
                href="../index.html"
                data-pt="🏠 Início"
                data-en="🏠 Home">

                🏠 Início

            </a>


            <!-- MINHA CONTA -->
            <a
                href="../html/form.html"
                data-pt="👤 Minha conta"
                data-en="👤 My account">

                👤 Minha conta

            </a>


            <!-- MENU -->
            <div class="menu-container">

                <button
                    type="button"
                    class="menu">

                    ☰

                </button>


                <div class="menu-opcoes">

                    <a
                    href="../html/receita.html"
                    data-pt="📄 Receitas"
                    data-en="📄 Patterns">
                    📄 Receitas
                    </a>

                    <a
                    href="../index.html"
                    data-pt="🧸 Amigurumis"
                    data-en="🧸 Amigurumis">
                    🧸 Amigurumis
                    </a>

                    <a
                        href="../html/colecoes.html"
                        data-pt="🛍️ Coleções"
                        data-en="🛍️ Collections">
                        🛍️ Coleções
                    </a>


                    <a
                        href="../html/material.html"
                        data-pt="🧵 Materiais"
                        data-en="🧵 Materials">
                     
                       🧵 Materiais
                    </a>

                </div>

            </div>

        </nav>

    </header>

    <main class="conteudo">

        <div id="principal">

            <div class="titulos">
                <!-- data-pt e data-en adicionados para tradução dinâmica -->
                <h3 id="titulo-destaques" data-pt="COLEÇÕES DA LOJA" data-en="STORE COLLECTIONS">COLEÇÕES DA LOJA</h3>
            </div>

            <div class="produtos">

                <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/diferentoes.png" alt="">
                            <span class="card-tag" data-pt="Diferentões" data-en="Different Ones">Diferentões</span>
                          <button class="botao-comprar" data-pt="Ver mais" data-en="View more">
                Ver mais
            </button>
                        </div>
                </div>

                 <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/coloridos.jpg" alt="">

                             <button class="botao-comprar">
                Ver mais
            </button>
                        </div>
                </div>

                <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/personagens.jpg" alt="">
                            <span class="card-tag" data-pt="Personagens" data-en="Characters">Personagens</span>
                             <button class="botao-comprar" >
                Ver mais
            </button>
                        </div>
                </div>

                  <div class="caixa">

                            <img class="card-imagem" src="../assets/fotos/animais.jpg" alt="">
                            <span class="card-tag" data-pt="Animais" data-en="Animals">Animais</span>
                            <button class="botao-comprar">

            </button>

                </div>

                <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/domar.jpg" alt="">
                            <span class="card-tag" data-pt="Do mar" data-en="From the Sea">Do mar</span>
                           <button class="botao-comprar" >
                Ver mais
            </button>
                        </div>
                </div>

                <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/pintinhos.jpg" alt="">
                            <span class="card-tag" data-pt="Pintinhos" data-en="Chicks">Pintinhos</span>
                             <button class="botao-comprar" >
                Ver mais
            </button>
                        </div>
                </div>

            </div>

        </div>
