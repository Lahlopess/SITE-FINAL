<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coelho</title>

    <link rel="stylesheet" href="../css/so.css">
    <script src="../javaScript/script.js" defer></script>
</head>

<body>

    <main class="pagina-produto">

        <div class="imagem-produto">
            <img src="../assets/fotos/coelho.jpg" alt="Coelho">
        </div>

        <div class="informacoes-produto">

            <span class="categoria" data-pt="NOSSO PRODUTO" data-en="OUR PRODUCT">NOSSO PRODUTO</span>

            <h1 data-pt="Coelho" data-en="Rabbit">Coelho</h1>

            <div class="estrelas">
                ★★★★★
                <span>5.0</span>
            </div>

            <p class="descricao" data-pt="Um coelhinho lindo e especial para deixar seu ambiente ainda mais aconchegante. Perfeito para quem ama coelhos e quer algo diferente." data-en="A lovely and special little rabbit to make your space even cozier. Perfect for anyone who loves rabbits and wants something different.">
                Um coelhinho lindo e especial para deixar seu
                ambiente ainda mais aconchegante. Perfeito
                para quem ama gatos e quer algo diferente.
            </p>

            <div class="linha"></div>

            <p class="preco">R$ 25,00</p>

           
            <div id="quantidade">
            <button class="botao-quantidade" onclick="diminuir()">-</button>
            <span id="numero">1</span>
            <button class="botao-quantidade" onclick="aumentar()">+</button>
            </div>

            <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>

        </div>

    </main>

</body>

</html>
