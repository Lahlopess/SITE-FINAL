<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pinguim</title>

    <link rel="stylesheet" href="../css/so.css">
    <script src="../javaScript/script.js" defer></script>
</head>

<body>

     <main class="pagina-produto">

        <a href="../INDEX.HTML" class="botao-voltar">←</a>

        <div class="imagem-produto">
            <img src="../assets/fotos/pinguim.jpg" alt="Pinguim">
        </div>

        <div class="informacoes-produto">

            <span class="categoria" data-pt="NOSSO PRODUTO" data-en="OUR PRODUCT">NOSSO PRODUTO</span>

            <h1 data-pt="Pinguim" data-en="Penguin">Pinguim</h1>

            <div class="estrelas">
                ★★★★★
                <span>5.0</span>
            </div>

            <p class="descricao" data-pt="Um pinguim fofo e encantador, perfeito para quem gosta desses animais adoráveis. Uma escolha especial para deixar seu espaço mais divertido e cheio de personalidade." data-en="A cute and charming penguin, perfect for anyone who loves these adorable animals. A special choice to make your space more fun and full of personality.">
                Um pinguim fofo e encantador, perfeito para quem
                gosta desses animais adoráveis. Uma escolha
                especial para deixar seu espaço mais divertido
                e cheio de personalidade.
            </p>

            <div class="linha"></div>

            <p class="preco">R$ 18,00</p>

           
            <div id="quantidade">
            <button class="botao-quantidade" onclick="diminuir()">-</button>
            <span id="numero">1</span>
            <button class="botao-quantidade" onclick="aumentar()">+</button>
            </div>

            <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>

        </div>

    </main>

</body>

</html>
