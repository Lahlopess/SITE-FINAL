<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peixe</title>

    <link rel="stylesheet" href="../css/so.css">
    <script src="../javaScript/script.js" defer></script>
</head>

<body>

    <main class="pagina-produto">

        <div class="imagem-produto">
            <img src="../assets/fotos/peixe.jpg" alt="Peixe">
        </div>

        <div class="informacoes-produto">

            <span class="categoria" data-pt="NOSSO PRODUTO" data-en="OUR PRODUCT">NOSSO PRODUTO</span>

            <h1 data-pt="Peixe" data-en="Fish">Peixe</h1>

            <div class="estrelas">
                ★★★★★
                <span>5.0</span>
            </div>

            <p class="descricao" data-pt="Um peixe bonito e encantador, perfeito para deixar seu espaço mais alegre e cheio de vida. Uma ótima escolha para quem procura algo especial e diferente." data-en="A beautiful and charming fish, perfect for making your space happier and full of life. A great choice for anyone looking for something special and different.">
                Um peixe bonito e encantador, perfeito para
                deixar seu espaço mais alegre e cheio de vida.
                Uma ótima escolha para quem procura algo
                especial e diferente.
            </p>

            <div class="linha"></div>

            <p class="preco">R$ 25,00</p>

            
            <div id="quantidade">
            <button class="botao-quantidade" onclick="diminuir()">-</button>
            <span id="numero">1</span>
            <button class="botao-quantidade" onclick="aumentar()">+</button>
            </div>

            <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>

        </div>

    </main>

</body>

</html>
