<!DOCTYPE html>
<!-- O atributo lang vai mudar dinamicamente via JavaScript entre "pt-BR" e "en" -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lolah Amigurumi</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../javaScript/script.js" defer></script>
</head>

<body>

    <!-- ACESSIBILIDADE: Trocado de div para header para indicar o topo da página -->
   
    <header id="topo">

        <!-- LOGO -->
        <a href="../index.html" id="logo">

            <img src="../assets/fotos/logo.png" alt="Lolah Amigurumi">

        </a>


        <!-- BARRA DE PESQUISA -->
        <div class="barra-pesquisa">

            <input
                type="text"
                placeholder="O que você está procurando?"
                aria-label="Buscar produtos">

            <button type="button">🔍</button>

        </div>


        <!-- NAVEGAÇÃO -->
        <nav class="navegacao">

            <!-- BOTÃO DE TEMA -->
            <button
                type="button"
                id="btn-tema"
                data-pt="🌑 Modo Escuro"
                data-en="🌑 Dark Mode">

                🌑 Modo Escuro

            </button>


            <!-- IDIOMA -->
            <div class="seletor-idioma">

                <label for="idioma-select" class="sr-only">
                    Idioma
                </label>

                <select id="idioma-select">

                    <option value="pt">PT-BR</option>

                    <option value="en">EN</option>

                </select>

            </div>


            <!-- CARRINHO -->
            <a
                href="../html/carrinho.html"
                data-pt="🛒 Carrinho"
                data-en="🛒 Cart">

                🛒 Carrinho

            </a>

            <!-- MINHA CONTA -->
            <a
                href="../INDEX.HTML"
                data-pt="🏠 Início"
                data-en="🏠 Home">

                🏠 Início

            </a>


            <!-- MINHA CONTA -->
            <a
                href="login.html"
                data-pt="👤 Minha conta"
                data-en="👤 My account">

                👤 Minha conta

            </a>


            <!-- MENU -->
            <div class="menu-container">

                <button
                    type="button"
                    class="menu">

                    ☰

                </button>


                <div class="menu-opcoes">

                    <a
                    href="../html/receita.html"
                    data-pt="📄 Receitas"
                    data-en="📄 Patterns">
                    📄 Receitas
                    </a>

                    <a
                    href="../INDEX.HTML"
                    data-pt="🧸 Amigurumis"
                    data-en="🧸 Amigurumis">
                    🧸 Amigurumis
                    </a>

                    <a
                        href="../html/colecoes.html"
                        data-pt="🛍️ Coleções"
                        data-en="🛍️ Collections">
                        🛍️ Coleções
                    </a>


                    <a
                        href="../html/material.html"
                        data-pt="🧵 Materiais"
                        data-en="🧵 Materials">
                     
                       🧵 Materiais
                    </a>

                </div>

            </div>

        </nav>

    </header>
    <main class="conteudo">

        <div id="principal">

            <div class="titulos">
                <!-- data-pt e data-en adicionados para tradução dinâmica -->
                <h3 id="titulo-destaques" data-pt="MATERIAIS DA LOJA" data-en="STORE MATERIALS">MATERIAIS DA LOJA</h3>
            </div>

            <div class="produtos">

                <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/agulha.jpg" alt="">
                            <span class="card-tag" data-pt="Agulha 2.0mm" data-en=" 2.0mm neddle">Agulha 2.0mm</span>
                            <p>R$ 15,00</p>
           <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>
                        </div>
                </div>

                 <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/agulha-fina.jpg" alt="">
                            <span class="card-tag" data-pt="Agulha 3.5mm" data-en=" 3.5mm neddle">Agulha 3.5mm</span>
                            <p>R$ 15,00</p>
            <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>
                        </div>
                </div>

                <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/linhas-pasteis.jpg" alt="">
                            <span class="card-tag" data-pt="Kit 4 Linhas Pasteis" data-en="Set of 4 Crochet Yarns">Kit 4 Linhas Pasteis</span>
                            <p>R$ 45,00</p>
              <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>
                        </div>
                </div>

                  <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/roxo.jpg" alt="">
                            <span class="card-tag" data-pt="Barbante Roxo 1kg" data-en="Purple Yarn 1kg">Barbante Roxo 1kg</span>
                            <p>R$ 35,00</p>
            <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>
                        </div>
                </div>

                <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/preto.jpg" alt="">
                            <span class="card-tag" data-pt="Barbante Preto 1kg" data-en="Black Yarn 1kg">Barbante Preto 1kg</span>
                            <p>R$ 35,00</p>
                <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>
                        </div>
                </div>

                <div class="caixa">
                        <div class="produto">
                            <img class="card-imagem" src="../assets/fotos/argola.jpg" alt="">
                            <span class="card-tag" data-pt="Kit 30 Argolas para chaveiro" data-en="Set of 30 Rings for Keychain">Kit 30 Argolas para chaveiro</span>
                            <p>R$ 20,00</p>
                <button class="botao-comprar" onclick="adicionarAoCarrinho()" data-pt="Adicionar ao carrinho" data-en="Add to cart">
                Adicionar ao carrinho
            </button>
                        </div>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
